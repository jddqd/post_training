# mini-swe-agent configuration for the code tasks (tasks/workspace.py), in mini-swe-agent's own format:
# the same file drives our MLX rollouts and the real `mini` agent at evaluation time.
# Templates are Jinja, rendered by DefaultAgent with the variables passed to agent.run():
# task (the problem statement), signature, function.

agent:
  system_template: |
    You are a careful Python programmer working in a Linux shell. You have one tool, `bash`, which runs a shell command and returns its output. Call it exactly once in every response.
  instance_template: |
    Implement the function `{{function}}` in `solution.py`.

    <problem>
    {{task}}
    </problem>

    Keep this exact signature:
    ```python
    {{signature}}
    ```

    Your working directory is /workspace. It contains:
    - `solution.py`: the signature with an empty body. Write your implementation there.
    - `test_public.py`: 3 example tests. Run them with `python test_public.py`.

    Hidden tests will also check other inputs, including edge cases: the function must be correct in general, not only on the examples.

    Work step by step, one command per response:
    1. Write the function, for example with `cat <<'EOF' > solution.py`.
    2. Run `python test_public.py` and fix the code until all tests pass.
    3. Check edge cases with a short command: `python -c "from solution import {{function}}; print({{function}}(<edge-case input>))"`.
    4. When you are done, submit with `echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT`, alone in its command. You cannot act after it.

    Rules:
    - Every command runs in a new shell started in /workspace.
    - Only Python 3.12 and its standard library are available: no network, no pip install.
  step_limit: 15
  cost_limit: 0  # local model: no cost
  max_consecutive_format_errors: 3

environment:
  image: python:3.12-slim
  cwd: /workspace
  # Commands are killed inside the container after 10 s (exit code 124): mini-swe-agent's own
  # timeout only stops the `docker exec` client, and the command would keep running.
  interpreter: ["timeout", "-k", "2", "10", "bash", "-lc"]
  timeout: 20  # safety net on the docker exec client
  # The workspace is mounted per rollout (-v <dir>:/workspace) by the sandbox code.
  run_args: ["--rm", "--network", "none", "--memory", "512m", "--cpus", "1"]
  env:
    PAGER: cat
    MANPAGER: cat
    PYTHONDONTWRITEBYTECODE: "1"
    PIP_DISABLE_PIP_VERSION_CHECK: "1"

model:
  # The tool response the model reads after each command; long outputs are cut in the middle.
  observation_template: |
    <returncode>{{ output.returncode }}</returncode>
    {% if output.returncode in [124, 137] -%}
    <warning>The command was stopped after 10 seconds.</warning>
    {% endif -%}
    {% if output.exception_info -%}
    <exception>{{ output.exception_info }}</exception>
    {% endif -%}
    {% if output.output | length <= 3000 -%}
    <output>
    {{ output.output }}</output>
    {%- else -%}
    <output_head>
    {{ output.output[:1500] }}</output_head>
    <elided_chars>{{ output.output | length - 3000 }}</elided_chars>
    <output_tail>
    {{ output.output[-1500:] }}</output_tail>
    {%- endif %}
  format_error_template: |
    Format error: {{ error }}
    Every response must call the `bash` tool exactly once, with the command as its `command` argument. To finish, call it with `echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT`.
  model_kwargs:  # sampling for RL: the raw distribution (no top-k, no penalty)
    temperature: 1.0
    max_tokens: 1024

rollout:
  max_context_tokens: 8000  # stop (reward 0) when the conversation outgrows this
