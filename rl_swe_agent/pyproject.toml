# RL (GRPO + LoRA in MLX) of a code agent inside the mini-swe-agent harness, from Qwen3.5
# (see docs/RL_CODE_AGENT_PLAN.md and docs/ROADMAP.md, local).
#
# Its own environment, like rl/ and eval/bfcl: mlx-lm and mini-swe-agent move fast and must never
# change the training (SFT) environment.
[project]
name = "rl-swe-agent"
version = "0.1.0"
description = "Code tasks, sandbox, harness driver and GRPO loop for a mini-swe-agent code agent."
requires-python = ">=3.12,<3.13"
dependencies = [
    # MLX: generation and LoRA training on Apple Silicon.
    "mlx-lm; sys_platform == 'darwin'",
    # The harness: its config (templates), action parsing and Environment protocol.
    "mini-swe-agent==2.4.6",
    "huggingface-hub>=2.4.0",
    "pyarrow>=26.0.1",
    "pyyaml>=6.0.4",
]

[dependency-groups]
dev = [
    "pytest",
 "mypy",
 "ruff",
 "types-pyyaml>=6.0.12.20261113",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rl_swe_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF", "PTH"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "scripts", "tests"]
mypy_path = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true
