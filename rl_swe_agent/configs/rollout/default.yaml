group_size: 8  # rollouts per task (a GRPO group)
tasks_per_batch: 1  # tasks whose groups run together: batch = group_size x tasks_per_batch
step_limit: 15  # model calls per episode
max_consecutive_format_errors: 3
max_tokens: 1024  # per response
max_context_tokens: 8000  # per episode: prompt, responses and observations
command_timeout: 10  # seconds, then the command is killed inside the container
