# Same experiment as sft_qwen3_base_xlam_gpu.yaml, with packing (TRL only, flash-attn needed):
#   uv run python scripts/train_trl.py --config configs/sft_qwen3_base_xlam_gpu_packed.yaml
# Several conversations per 8 192-token sequence (best-fit decreasing, never split), attention
# isolated per conversation by flash-attention's varlen kernels. Every forward has the same size.
# Numbers for our data: 55 627 train rows, 30.3M tokens -> 3 745 packed sequences (98.9% full).
name: sft-qwen3-base-xlam-gpu-packed

model:
  name: Qwen/Qwen3-0.6B-Base
  dtype: float32 # master weights (bf16 weights would round most Adam updates to zero)
  attn_implementation: flash_attention_2 # packing needs it (varlen kernels, no cross-talk)

data:
  train_file: data/xlam/train.jsonl
  val_file: data/xlam/val.jsonl

train:
  # Batch: 2 packed sequences per forward (16k tokens) x 2 accumulation steps = 32.8k tokens
  # (~59 conversations) per update, close to the unpacked config (64, ~35k tokens).
  # 3 745 / 4 = 936 updates per epoch; 2 epochs = 1 872 updates.
  batch_size: 2
  gradient_accumulation_steps: 2
  max_steps: 1872

  # Optimizer: AdamW. Full fine-tuning of a small model: 2e-5 is a moderate peak lr (a base
  # model has the whole chat / tool-call format to learn; 1e-5 learned slowly on Mac tests).
  lr: 2.0e-5
  weight_decay: 0.0 # common for SFT: a few thousand updates, little overfitting risk
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-8
  max_grad_norm: 1.0 # clipping: we saw grad norms of 100-400 on the first batches

  # Schedule: ~3% linear warmup, then cosine down to 10% of the peak.
  warmup_steps: 50
  min_lr_ratio: 0.1

  # Memory and speed
  mixed_precision: bf16 # tensor cores ~2x faster, activations halved; fp32 master weights
  gradient_checkpointing: true # 8 x up to 2 016 tokens: activations would not fit otherwise

  # Evaluation (1 721 validation rows) and logging
  eval_every: 100 # ~20 evaluations, plus one before training
  # Validation rows are not packed: 8 per forward (<= 16k tokens, like a training forward)
  # instead of batch_size = 2 rows, which would take 4x more forwards per evaluation.
  eval_batch_size: 8
  log_every: 10
  save_checkpoint: true # final weights in <run dir>/checkpoint, for eval/bfcl
  seed: 0

wandb:
  enabled: true # run `wandb login` once on the machine; wandb.enabled=false to skip
  project: post-training
  mode: online

trl:
  optim: adamw_torch_fused # one kernel for all parameters (CUDA)

  # Batching: packed sequences have no padding and all the same length (nothing to group).
  group_by_length: false
  padding_free: true # implied by bfd packing; explicit for readability
  packing: true
  packing_length: 8192 # >= the longest row (2 012 tokens): no conversation is truncated

  tf32: true # remaining fp32 matmuls in TensorFloat-32 (Ampere and newer: A10, A40, A100, 4090...)
  torch_compile: false # fixed shapes with packing: a good candidate to try
  activation_offloading: false # gradient checkpointing already handles activation memory

  neftune_noise_alpha: null # NEFTune: candidate ablation for step 6

  dataloader_num_workers: 2
  dataloader_pin_memory: true

  # Checkpoints every 200 updates (2 kept), with optimizer state: a stopped pod can resume.
  save_steps: 200
  save_total_limit: 2
  save_only_model: false
  load_best_model_at_end: false # the final model, not the lowest val loss (val loss != BFCL)
