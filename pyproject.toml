[project]
name = "post-training"
version = "0.1.0"
description = "Pipeline to post-train LLMs (SFT / preference tuning) and evaluate them on BFCL."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "datasets>=5.1.0",
    "jinja2>=3.1.6",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "torch>=2.14.1",
    "transformers>=5.20.0",
    "trl>=1.16.0",
    "wandb>=0.31.0",
]

# GPU training (RunPod): `uv sync --extra gpu`.
[project.optional-dependencies]
gpu = [
    # Prebuilt CUDA kernels from the HF Hub. With attn_implementation="flash_attention_2" and no
    # flash-attn package, transformers loads kernels-community/flash-attn2 through it: same
    # varlen kernels (padding-free, packing), nothing to compile (flash-attn ships sources
    # only, a long build tied to the exact torch/CUDA versions).
    "kernels>=0.17.2",
]
# vLLM (BFCL inference) is not a dependency of either environment: it pins its own torch and
# transformers versions, incompatible with ours. BFCL only runs the `vllm serve` command, so
# it is installed as a separate tool: scripts/runpod_setup.sh.

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/post_training"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # bugbear
  "UP",  # pyupgrade
  "SIM", # simplify
  "C4",  # comprehensions
  "RUF", # ruff-specific
  "N",   # pep8-naming
  "PTH", # use pathlib
  "PL",  # pylint
]
ignore = [
  "PLR0913", # too many arguments (common in training configs/functions)
  "N812",    # `import torch.nn.functional as F` is the universal PyTorch convention
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"] # magic values in asserts are fine

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src", "tests", "scripts"]
warn_unreachable = true
pretty = true
# torch / transformers leave some callables unannotated (e.g. `Tensor.backward`, model
# constructors); don't flag calls to them.
untyped_calls_exclude = ["torch", "transformers"]

[tool.pydantic-mypy]
init_forbid_extra = true # unknown kwargs to a model's __init__ are type errors
init_typed = true        # __init__ params use the field types (no implicit coercion)

# Untyped third-party libs (no py.typed marker): their imports are typed as Any.
[[tool.mypy.overrides]]
module = ["datasets", "datasets.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=post_training --cov-report=term-missing"
markers = [
  "gpu: requires a CUDA GPU (deselect with '-m \"not gpu\"')",
  "slow: slow tests (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
source = ["post_training"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
